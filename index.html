<title>Study for Scholarships · Scholarship Revision</title>
<script>
// Theme before first paint: "system" (default) follows the device; "light"/"dark" are chosen in the top bar.
(function(){
  const KEY = 'sr-theme';
  const media = matchMedia('(prefers-color-scheme: dark)');
  // dark unless the light (or device) setting has been picked in the top bar
  let pref = 'dark';
  try{ pref = localStorage.getItem(KEY) || 'dark'; }catch(e){}
  const resolved = () => pref === 'system' ? (media.matches ? 'dark' : 'light') : pref;
  function apply(){
    const t = resolved();
    document.documentElement.dataset.theme = t;
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.content = t === 'dark' ? '#120f0c' : '#f4f1ea';
    document.dispatchEvent(new CustomEvent('themechange', {detail: {pref, theme: t}}));
  }
  media.addEventListener('change', () => { if(pref === 'system') apply(); });
  window.srTheme = {
    pref: () => pref,
    theme: resolved,
    set(p){ pref = p; try{ localStorage.setItem(KEY, p); }catch(e){} apply(); },
    // system → light → dark → system
    cycle(){ this.set(pref === 'system' ? 'light' : pref === 'light' ? 'dark' : 'system'); }
  };
  apply();
})();
</script>

<style>
  /* ---------- Design tokens: dark is the default, light overrides ---------- */
  :root{
    --night:#120f0c;
    --surface:rgba(20,17,14,0.68);
    --surface-hover:rgba(28,24,20,0.8);
    --solid:#1b1814;
    --raise:rgba(255,255,255,0.045);
    --raise-hover:rgba(255,255,255,0.085);
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.18);
    --text:#F6F2EA;
    --muted:#BCB3A4;
    --faint:#8F877A;
    --gold:#D6B15E;
    --gold-ink:#1D1609;
    --topbar:rgba(18,15,12,0.62);
    --scrim-home:
      linear-gradient(90deg, rgba(12,10,8,0.42) 0%, rgba(12,10,8,0.18) 60%, rgba(12,10,8,0.32) 100%),
      linear-gradient(180deg, rgba(12,10,8,0.45) 0%, rgba(12,10,8,0.6) 40%, rgba(12,10,8,0.85) 100%);
    --scrim-gate:
      radial-gradient(140% 90% at 50% 10%, rgba(12,10,8,0.15) 30%, rgba(12,10,8,0.6) 100%),
      linear-gradient(180deg, rgba(12,10,8,0.32) 0%, rgba(12,10,8,0.48) 45%, rgba(12,10,8,0.78) 100%);
    --shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 20px 50px -20px rgba(0,0,0,0.6);
    --overlay:rgba(8,6,4,0.55);
    --paper:#FBF9F4;
    --ink:#1E1B17;
    --ink-soft:#5E574C;
    --danger:#9E2530;
    --serif:'Fraunces', Georgia, 'Times New Roman', serif;
    --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --r-lg:18px; --r-md:12px; --r-sm:8px;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --night:#f4f1ea;
    --surface:rgba(255,255,255,0.74);
    --surface-hover:rgba(255,255,255,0.92);
    --solid:#ffffff;
    --raise:rgba(30,27,23,0.035);
    --raise-hover:rgba(30,27,23,0.065);
    --border:rgba(30,27,23,0.10);
    --border-strong:rgba(30,27,23,0.2);
    --text:#1E1B17;
    --muted:#575045;
    --faint:#867D6F;
    --gold:#8A6114;
    --gold-ink:#FFFFFF;
    --topbar:rgba(250,248,243,0.74);
    --scrim-home:
      linear-gradient(180deg, rgba(246,243,236,0.72) 0%, rgba(246,243,236,0.84) 40%, rgba(246,243,236,0.95) 100%);
    --scrim-gate:
      radial-gradient(140% 90% at 50% 10%, rgba(246,243,236,0) 35%, rgba(246,243,236,0.35) 100%),
      linear-gradient(180deg, rgba(246,243,236,0.10) 0%, rgba(246,243,236,0.25) 60%, rgba(246,243,236,0.5) 100%);
    --shadow:0 1px 2px rgba(30,27,23,0.05), 0 18px 40px -22px rgba(30,27,23,0.35);
    --overlay:rgba(40,34,26,0.32);
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{background:var(--night);}
  body{min-height:100vh;font-family:var(--sans);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  button, input{font-family:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px;}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

  /* ---------- Rotating backdrop ---------- */
  .backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--night);}
  .bg-layer{position:absolute;inset:-2%;background-size:cover;background-position:center;opacity:0;z-index:0;transition:opacity 2.4s ease;}
  .bg-layer.show{opacity:1;z-index:1;animation:drift 18s ease-out forwards;}
  .bg-layer.instant{transition:none;}
  /* the outgoing photo stays fully visible underneath while the next one fades in over it */
  .bg-layer.under{opacity:1;z-index:0;transition:none;animation:drift 18s ease-out forwards;}
  @keyframes drift{from{transform:scale(1.02);}to{transform:scale(1.1);}}
  .backdrop::after{content:"";position:absolute;inset:0;z-index:2;background:var(--scrim-gate);transition:background .6s ease;}
  body:not(.locked) .backdrop::after{background:var(--scrim-home);}
  .photo-credit{
    position:fixed;z-index:3;left:20px;bottom:16px;max-width:calc(100% - 40px);
    display:flex;align-items:center;gap:8px;font-size:11.5px;color:rgba(246,242,234,0.7);
    text-shadow:0 1px 6px rgba(0,0,0,0.5);
  }
  .photo-credit .dot{width:6px;height:6px;border-radius:50%;background:#D6B15E;flex:none;}
  .photo-credit a{color:rgba(246,242,234,0.88);text-decoration:none;border-bottom:1px solid rgba(246,242,234,0.3);}
  body:not(.locked) .photo-credit{display:none;}

  /* ---------- Sign-in ---------- */
  body.locked #app{display:none;}
  .gate{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:24px 16px 64px;}
  .gate[hidden]{display:none;}
  .gate-card{
    width:min(400px, 100%);
    background:rgba(251,249,244,0.96);color:var(--ink);
    border-radius:var(--r-lg);padding:32px 30px 26px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.4) inset;
    transition:opacity .3s ease, transform .3s ease;
  }
  .gate-card.pending{opacity:0;transform:translateY(6px);pointer-events:none;}
  .wordmark{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;}
  .mark{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#2A2117,#15110C);box-shadow:0 0 0 1px rgba(214,177,94,0.35) inset;}
  .wordmark-text{font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;}
  .gate .wordmark-text{color:var(--ink-soft);}
  .gate-title{font-family:var(--serif);font-weight:500;font-size:32px;line-height:1.1;letter-spacing:-.01em;margin:22px 0 6px;color:var(--ink);}
  .gate-sub{margin:0 0 24px;font-size:14.5px;color:var(--ink-soft);}
  .gate-form{display:grid;gap:14px;}
  .gate-form label{display:grid;gap:6px;font-size:13px;font-weight:500;color:var(--ink-soft);}
  .gate-form input{width:100%;padding:11px 13px;font-size:16px;border:1px solid rgba(30,27,23,0.16);border-radius:var(--r-sm);background:#fff;color:var(--ink);transition:border-color .15s ease, box-shadow .15s ease;}
  .gate-form input:focus{outline:none;border-color:#B89443;box-shadow:0 0 0 3px rgba(214,177,94,0.28);}
  .gate-btn{margin-top:6px;border:none;border-radius:var(--r-sm);padding:12px 18px;font-size:15px;font-weight:600;background:#1E1A15;color:#fff;transition:background .15s ease;}
  .gate-btn:hover{background:#352C21;}
  .gate-btn[disabled]{opacity:.7;cursor:wait;}
  .gate-error{margin:0;font-size:13.5px;color:var(--danger);}
  .gate-error[hidden]{display:none;}
  .gate-form[hidden]{display:none;}
  #guestCode{font-size:22px;letter-spacing:.35em;text-align:center;font-variant-numeric:tabular-nums;}
  .gate-links{margin:2px 0 0;font-size:13px;color:var(--ink-soft);text-align:center;}
  .gate-link{border:none;background:none;padding:0;font:inherit;color:#8A6B25;text-decoration:underline;cursor:pointer;}
  .guest-pill{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:50;padding:7px 14px;border-radius:999px;background:rgba(30,26,21,0.88);color:#F3E7C8;font-size:12.5px;box-shadow:0 4px 16px rgba(0,0,0,0.25);}
  .gate-foot{margin:20px 0 0;padding-top:16px;border-top:1px solid rgba(30,27,23,0.08);font-size:12.5px;color:var(--ink-soft);}
</style>
<style>
  /* ---------- App frame ---------- */
  #app{position:relative;z-index:2;}
  .container{max-width:1140px;margin:0 auto;padding:0 28px;}
  .topbar{position:sticky;top:0;z-index:20;background:var(--topbar);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--border);}
  .topbar .container{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .topbar .wordmark-text{color:var(--text);}
  .topbar-right{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);}
  .cmdk{display:inline-flex;align-items:center;gap:10px;min-width:220px;border:1px solid var(--border);background:var(--raise);color:var(--faint);border-radius:999px;padding:7px 8px 7px 13px;font-size:13.5px;transition:border-color .15s ease, background .15s ease;}
  .cmdk:hover{border-color:var(--border-strong);background:var(--raise-hover);color:var(--muted);}
  .cmdk span{flex:1;text-align:left;}
  kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--raise);}
  .icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);transition:background .15s ease, border-color .15s ease;}
  .icon-btn:hover{background:var(--raise-hover);border-color:var(--border-strong);}
  .avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#1D1609;background:linear-gradient(145deg,#E5C77F,#B8913F);flex:none;}
  .btn-ghost{border:1px solid var(--border-strong);background:transparent;color:var(--text);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;white-space:nowrap;transition:background .15s ease, border-color .15s ease;}
  .btn-ghost:hover{background:var(--raise-hover);}

  /* ---------- Hero ---------- */
  .hero{padding:68px 0 8px;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);}
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--gold);}
  .back-link{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);text-decoration:none;transition:gap .2s ease;}
  .back-link svg{transform:scaleX(-1);}
  .back-link:hover{gap:12px;}
  .courses.one{grid-template-columns:1fr;}
  .hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(40px, 6vw, 68px);line-height:1.02;letter-spacing:-.02em;margin:0 0 18px;}
  .hero h1 em{font-style:italic;color:var(--gold);}
  .lede{margin:0;max-width:58ch;font-size:17.5px;color:var(--muted);}
  .stats{display:flex;flex-wrap:wrap;gap:0;margin:34px 0 0;padding:0;list-style:none;}
  .stats li{padding:0 28px;border-left:1px solid var(--border-strong);}
  .stats li:first-child{padding-left:0;border-left:none;}
  .stat-num{display:block;font-family:var(--serif);font-size:30px;line-height:1.1;}
  .stat-label{font-size:12.5px;color:var(--faint);letter-spacing:.04em;}

  .block{margin-top:64px;}
  .block-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:20px;}
  .block-kicker{margin:0 0 6px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--faint);}
  .block-head h2{font-family:var(--serif);font-weight:500;font-size:32px;letter-spacing:-.01em;margin:0;}
  .block-head p{margin:6px 0 0;color:var(--muted);font-size:14.5px;}

  /* ---------- Jump back in / Pinned ---------- */
  .shelves{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:20px;margin-top:44px;}
  .shelves[hidden], .shelf[hidden]{display:none;}
  .shelves.single{grid-template-columns:1fr;}
  .shelf-head{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);}
  .minis{display:grid;gap:8px;}
  .mini{display:flex;align-items:center;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:background .15s ease, border-color .15s ease;}
  .mini:hover{background:var(--surface-hover);border-color:var(--border-strong);}
  .mini-link{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 12px;text-decoration:none;color:var(--text);border-radius:var(--r-md);}
  .mini .star{opacity:1;}
  .mini-title{display:block;font-weight:600;font-size:14.5px;line-height:1.3;}
  .mini-meta{display:block;font-size:12.5px;color:var(--faint);}

  /* ---------- Courses ---------- */
  .courses{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:20px;}
  .course{
    position:relative;display:flex;flex-direction:column;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:28px;text-decoration:none;color:var(--text);box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    transition:transform .2s ease, border-color .2s ease, background .2s ease;overflow:hidden;
  }
  .course::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--stripe);}
  .course:hover{transform:translateY(-3px);border-color:var(--border-strong);background:var(--surface-hover);}
  .course-top{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .tile{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--tile);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.14) inset;}
  .tile.sm{width:36px;height:36px;border-radius:10px;}
  .course-tag{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);}
  .course h3{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.15;letter-spacing:-.01em;margin:0 0 10px;}
  .course p{margin:0 0 20px;color:var(--muted);font-size:15px;}
  .features{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 26px;padding:0;list-style:none;}
  .features li{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--raise);border:1px solid var(--border);}
  .course-cta{margin-top:auto;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:10px 16px;border-radius:999px;background:var(--gold);color:var(--gold-ink);font-weight:600;font-size:14px;transition:gap .2s ease;}
  .course:hover .course-cta{gap:12px;}

  /* ---------- Study tools ---------- */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--border);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);max-width:100%;overflow-x:auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:none;white-space:nowrap;border:none;background:transparent;color:var(--muted);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:background .15s ease, color .15s ease;}
  .tab:hover{color:var(--text);}
  .tab[aria-pressed="true"]{background:var(--text);color:var(--night);}
  .tab .n{font-family:var(--mono);font-size:11px;opacity:.7;}
  .tab-dot{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;background:var(--tile);color:#fff;flex:none;}
  /* the tab row fades at the right edge while there are more subjects to scroll to */
  @supports (mask-image: linear-gradient(#000, #000)){
    .tabs{mask-image:linear-gradient(90deg, #000 calc(100% - 28px), transparent);}
    .tabs.at-end{mask-image:none;}
  }
  .search{position:relative;flex:0 1 300px;min-width:200px;}
  .search svg{position:absolute;z-index:1;left:13px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;}
  .search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);}
  .search input{width:100%;padding:10px 40px 10px 38px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:border-color .15s ease;}
  .search input::placeholder{color:var(--faint);}
  .search input:focus{outline:none;border-color:var(--gold);}
  .subjects{display:grid;gap:18px;}
  .subject{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);overflow:hidden;}
  .subject[hidden], .group[hidden], .tool[hidden]{display:none;}
  .subject-head{display:flex;align-items:center;gap:14px;padding:18px 24px;border-bottom:1px solid var(--border);}
  .subject-name{font-family:var(--serif);font-weight:500;font-size:22px;margin:0;}
  .subject-title{flex:1;min-width:0;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap;}
  .subject-link{flex:none;display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;border:1px solid var(--border-strong);font-size:13px;font-weight:600;text-decoration:none;color:var(--text);white-space:nowrap;transition:background .15s ease, border-color .15s ease;}
  .subject-link:hover{background:var(--raise-hover);border-color:var(--gold);}
  .subject-link svg{color:var(--gold);}
  .subject-body{padding:10px 18px 14px;display:grid;gap:8px;}

  /* progress bars: hero card, subject heads and topic rows */
  .bar{position:relative;display:block;height:6px;border-radius:999px;background:var(--raise-hover);overflow:hidden;}
  .bar > span{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;background:var(--gold);transition:width .4s ease;}
  .bar.lg{height:9px;}
  .full .bar > span, .bar.done > span{background:#5DA97A;}
  .meter{display:inline-flex;align-items:center;gap:9px;}
  .meter .bar{width:96px;}
  .meter-n{font-family:var(--mono);font-size:11.5px;color:var(--faint);min-width:3ch;}
  .meter.full .meter-n{color:#5DA97A;}
  .progress-card{margin-top:30px;max-width:560px;padding:18px 20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);}
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;}
  .progress-label{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);}
  .progress-n{font-size:13.5px;color:var(--muted);}
  .progress-subjects{display:grid;grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));gap:10px 18px;margin-top:16px;}
  .mini-meter{display:flex;align-items:center;gap:8px;}
  .mini-meter .bar{flex:1;height:5px;}

  /* topics fold open and shut, each with its own progress */
  .group{border:1px solid var(--border);border-radius:var(--r-md);background:var(--raise);}
  .topic{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;border-radius:var(--r-md);}
  .topic::-webkit-details-marker{display:none;}
  .topic:hover{background:var(--raise-hover);}
  .chev{display:grid;color:var(--faint);transition:transform .2s ease;}
  .group[open] .chev{transform:rotate(90deg);}
  .topic-name{flex:1;min-width:0;font-weight:600;font-size:14.5px;}
  .topic-num{margin-right:10px;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;}
  .topic-body{padding:2px 14px 10px;display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:2px 28px;}
  .done{flex:none;width:28px;height:28px;margin-right:10px;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--border-strong);background:transparent;color:transparent;transition:background .15s ease, border-color .15s ease, color .15s ease;}
  .done:hover{border-color:#5DA97A;color:#5DA97A;}
  .done[aria-pressed="true"]{background:#5DA97A;border-color:#5DA97A;color:#fff;}
  .tool:has(.done[aria-pressed="true"]) .tool-title{color:var(--muted);}
  .tool{position:relative;display:flex;align-items:center;margin:0 -12px;border-radius:var(--r-md);transition:background .15s ease;}
  .tool:hover{background:var(--raise-hover);}
  .tool-link{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:11px 4px 11px 12px;text-decoration:none;color:var(--text);border-radius:var(--r-md);}
  .tool-title{display:block;font-weight:600;font-size:15px;line-height:1.3;}
  .tool-desc{display:block;font-size:13.5px;color:var(--muted);margin-top:2px;}
  .tool-note{display:inline-block;margin-left:6px;font-family:var(--mono);font-size:10.5px;color:var(--faint);font-weight:500;}
  .ext{color:var(--faint);transition:transform .15s ease, color .15s ease;}
  .tool:hover .ext{color:var(--text);transform:translate(1px,-1px);}
  .star{flex:none;width:34px;height:34px;margin-right:6px;display:grid;place-items:center;border:none;background:transparent;color:var(--faint);border-radius:50%;opacity:0;transition:opacity .15s ease, color .15s ease, background .15s ease;}
  .tool:hover .star, .star:focus-visible, .star[aria-pressed="true"]{opacity:1;}
  .star:hover{background:var(--raise-hover);color:var(--text);}
  .star[aria-pressed="true"]{color:var(--gold);}
  .star[aria-pressed="true"] svg{fill:currentColor;}
  @media (hover: none){ .star{opacity:1;} }
  .empty{padding:40px 24px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r-lg);}
  .empty[hidden]{display:none;}
  .fine{margin:16px 0 0;font-size:12.5px;color:var(--faint);}

  /* ---------- Quick open (command palette) ---------- */
  .palette{position:fixed;inset:0;z-index:50;display:grid;justify-items:center;align-items:start;padding:12vh 16px 16px;background:var(--overlay);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
  .palette[hidden]{display:none;}
  .palette-panel{width:min(620px, 100%);background:var(--solid);color:var(--text);border:1px solid var(--border-strong);border-radius:16px;box-shadow:0 40px 90px -20px rgba(0,0,0,0.6);overflow:hidden;animation:pop .16s ease-out;}
  @keyframes pop{from{transform:translateY(6px) scale(.985);opacity:0;}to{transform:none;opacity:1;}}
  .palette-input{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);color:var(--faint);}
  .palette-input input{flex:1;border:none;background:transparent;color:var(--text);font-size:17px;outline:none;}
  .palette-list{list-style:none;margin:0;padding:8px;max-height:min(420px, 55vh);overflow-y:auto;}
  .palette-section{padding:8px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);}
  .palette-item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;cursor:pointer;}
  .palette-item[aria-selected="true"]{background:var(--raise-hover);}
  .palette-item .tile.sm{width:30px;height:30px;border-radius:8px;}
  .palette-title{font-size:14.5px;font-weight:500;}
  .palette-sub{font-size:12.5px;color:var(--faint);}
  .palette-empty{padding:28px;text-align:center;color:var(--muted);font-size:14px;}
  .palette-foot{display:flex;gap:16px;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--border);font-size:12px;color:var(--faint);}
  .palette-foot kbd{margin-right:4px;}

  /* ---------- Past papers ---------- */
  .paper-grid{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:18px;align-items:start;}
  .paper-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);overflow:hidden;}
  .paper-card[hidden]{display:none;}
  .paper-rows{padding:6px 22px 18px;}
  .paper-row{padding:12px 0;border-bottom:1px solid var(--border);}
  .paper-row:last-child{border-bottom:none;}
  .paper-name{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted);}
  .years{display:flex;flex-wrap:wrap;gap:6px;}
  .year{display:inline-flex;align-items:center;gap:2px;padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--raise);color:var(--text);text-decoration:none;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;transition:background .15s ease, border-color .15s ease;}
  .year:hover{background:var(--raise-hover);border-color:var(--gold);}
  .year sup{font-size:9px;color:var(--faint);}
  .fine a{color:var(--muted);}

  /* ---------- Roque ---------- */
  .roque-btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;background:var(--gold);color:var(--gold-ink);white-space:nowrap;}
  .roque-btn:hover{filter:brightness(1.08);}
  .papers-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--gold);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--gold);text-decoration:none;white-space:nowrap;transition:background .15s ease;}
  .papers-btn:hover{background:var(--raise-hover);}
  .roque{position:fixed;z-index:30;top:0;right:0;bottom:0;width:min(430px, 100%);display:flex;flex-direction:column;background:var(--solid);border-left:1px solid var(--border-strong);box-shadow:-20px 0 60px -20px rgba(0,0,0,0.5);animation:slide .2s ease-out;}
  .roque[hidden]{display:none;}
  @keyframes slide{from{transform:translateX(24px);opacity:0;}to{transform:none;opacity:1;}}
  .roque-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);}
  .roque-head > div{flex:1;}
  .roque-title{margin:0;font-family:var(--serif);font-size:19px;font-weight:500;}
  .roque-sub{margin:0;font-size:12px;color:var(--faint);}
  .roque-body{flex:1;min-height:0;display:flex;flex-direction:column;}
  .roque-chat{flex:1;overflow-y:auto;padding:16px;display:grid;align-content:start;gap:14px;}
  .roque-msg{max-width:100%;}
  .roque-who{margin:0 0 4px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
  .roque-text{font-size:14.5px;line-height:1.6;}
  .roque-text p{margin:0 0 10px;}
  .roque-text ul, .roque-text ol{margin:0 0 10px;padding-left:20px;}
  .from-user .roque-text{background:var(--raise-hover);border:1px solid var(--border);border-radius:12px;padding:10px 12px;}
  .roque-note{margin:0;font-size:12.5px;color:var(--faint);}
  .roque-sources{margin:4px 0 8px;padding-left:18px;font-size:12.5px;}
  .roque-sources a{color:var(--muted);}
  .roque-suggestions{width:100%;height:70px;border:0;border-radius:8px;}
  .roque-input{border-top:1px solid var(--border);padding:12px 16px 16px;display:grid;gap:10px;}
  .roque-input textarea, .roque-setup input{width:100%;resize:vertical;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--raise);color:var(--text);font:inherit;font-size:14.5px;}
  .roque-input textarea:focus, .roque-setup input:focus{outline:none;border-color:var(--gold);}
  .roque-actions{display:flex;align-items:center;gap:10px;}
  .roque-send{border:none;border-radius:999px;padding:8px 18px;font-weight:600;font-size:14px;background:var(--gold);color:var(--gold-ink);}
  .roque-send[disabled]{opacity:.6;cursor:wait;}
  .roque-link{margin-left:auto;background:none;border:none;color:var(--faint);font-size:12.5px;text-decoration:underline;}
  .roque-setup{padding:20px 16px;display:grid;gap:12px;}
  .roque-setup label{font-weight:600;font-size:14.5px;}
  .roque-setup .roque-send{justify-self:start;}

  .footer{margin-top:88px;border-top:1px solid var(--border);}
  .footer .container{display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-top:22px;padding-bottom:28px;font-size:12.5px;color:var(--faint);}
  .footer a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--border-strong);}
  .footer a:hover{color:var(--text);}

  @media (max-width: 900px){
    .courses, .shelves, .paper-grid{grid-template-columns:1fr;}
    .roque-btn span, .papers-btn span{display:none;}
    .roque-btn, .papers-btn{width:36px;height:36px;padding:0;justify-content:center;}
    .cmdk{min-width:0;}
    .cmdk span, .cmdk kbd{display:none;}
    .cmdk{width:36px;height:36px;padding:0;justify-content:center;border-radius:50%;}
  }
  @media (max-width: 600px){
    .container{padding:0 18px;}
    .topbar .container{height:58px;}
    .topbar .wordmark-text{font-size:11px;letter-spacing:.12em;white-space:nowrap;}
    .topbar .mark{width:34px;height:34px;}
    .topbar-right{gap:6px;}

    .lede{font-size:16px;}
    .stats li{padding:0 18px;}

<script>
// Rotating backdrop: a few great libraries, one at a time, slowly crossfading. Only the photo on
// screen and the next one are downloaded. With reduced motion the first photo simply stays.
(function(){
  const PHOTOS = [
    // lift brightens a photo whose dark wood would otherwise disappear under the shading
    {src: 'bg-long-room.jpg', lift: 1.25, place: 'The Long Room, Trinity College Dublin', by: 'Diliff', license: 'CC BY-SA 4.0', page: 'https://commons.wikimedia.org/wiki/File:Long_Room_Interior,_Trinity_College_Dublin,_Ireland_-_Diliff.jpg'},
    {src: 'bg-radcliffe.jpg', place: 'The Radcliffe Camera, Oxford', by: 'Diliff (cropped)', license: 'CC BY 2.5', page: 'https://commons.wikimedia.org/wiki/File:Radcliffe_Camera,_Oxford_-_Oct_2006.jpg'},
    {src: 'bg-peabody.jpg', place: 'The George Peabody Library, Baltimore', by: 'Matthew Petroff', license: 'CC BY-SA 3.0', page: 'https://commons.wikimedia.org/wiki/File:George-peabody-library.jpg'},
    {src: 'bg-wren.jpg', place: 'The Wren Library, Trinity College, Cambridge', by: 'Cmglee', license: 'CC BY-SA 3.0', page: 'https://commons.wikimedia.org/wiki/File:Cmglee_Cambridge_Trinity_College_Neviles_Court.jpg'},
    {src: 'bg-bodleian.jpg', place: 'The Bodleian Library, Oxford', by: 'Honcques Laus', license: 'CC0', page: 'https://commons.wikimedia.org/wiki/File:Bibliotheca_Bodleiana.jpg'}
  ];
  const HOLD_MS = Number(new URLSearchParams(location.search).get('hold')) || 14000;  // ?hold= speeds it up for testing
  const layers = Array.from(document.querySelectorAll('.bg-layer'));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let i = 0, front = 1;   // so the first photo goes on the first layer

  const load = (src) => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => res(); im.src = src; });
  function credit(p){
    const el = document.getElementById('photoCreditText');
    el.innerHTML = '';
    el.append(p.place + ' — photo: ');
    const a = document.createElement('a');
    a.href = p.page; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = p.by + ', ' + p.license;
    el.append(a);
    window.currentPhoto = p;
    document.dispatchEvent(new CustomEvent('photochange', {detail: p}));
  }
  // the incoming photo sits on top (z-index 1) and fades in over the outgoing one
  async function show(n, instant){
    const p = PHOTOS[n];
    await load(p.src);
    const next = layers[1 - front], cur = layers[front];
    next.style.backgroundImage = `url("${p.src}")`;
    next.style.filter = p.lift ? `brightness(${p.lift})` : '';
    next.classList.toggle('instant', !!instant);
    next.classList.remove('show'); void next.offsetWidth;
    next.classList.add('show');
    cur.classList.remove('show', 'instant');
    if(!instant){
      cur.classList.add('under');
      setTimeout(() => cur.classList.remove('under'), 2600);
    }
    front = 1 - front;
    credit(p);
  }
  show(0, true).then(() => {
    if(still) return;
    const tick = async () => {
      i = (i + 1) % PHOTOS.length;
      await show(i);
      setTimeout(tick, HOLD_MS);
    };
    load(PHOTOS[1].src);
    setTimeout(tick, HOLD_MS);
  });
})();
</script>

<script>
// The home page (src/home.js, kept off GitHub) is published only in encrypted form (#homeData).
// Signing in derives a key from "username|password" with PBKDF2 and decrypts it. The salt is shared
// with the French course and Challenge Reading (both on this same site), so the same key is saved for
// them too: one sign-in here opens all three.
(function(){
  const $ = (id) => document.getElementById(id);
  const ITERATIONS = 250000;              // must match src/build.sh
  const MARKER = '// scholarship-home-v1';
  const HOME_STORE = 'scholarship-unlock';
  const SHARED_STORES = ['french-unlock', 'challenge-unlock'];   // the French course and Challenge Reading

  const hex = (u) => Array.from(u, x => x.toString(16).padStart(2, '0')).join('');
  const unhex = (s) => new Uint8Array(s.match(/../g).map(h => parseInt(h, 16)));
  const read = (k) => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const write = (k, v) => { try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} };

  function cipher(){
    const bytes = Uint8Array.from(atob($('homeData').textContent.trim()), ch => ch.charCodeAt(0));
    return {salt: bytes.slice(8, 16), body: bytes.slice(16)};
  }
  async function deriveBits(pass, salt){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256'}, base, 384));
  }
  async function unlock(bits, c){
    try{
      const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), {name: 'AES-CBC'}, false, ['decrypt']);
      const text = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-CBC', iv: bits.slice(32, 48)}, key, c.body));
      return text.startsWith(MARKER) ? text : null;
    }catch(e){
      return null;
    }
  }
  function launch(source, c, bits){
    if(c){          // a real sign-in: remember it here and for the French course and Challenge Reading
      const saved = hex(c.salt) + ':' + hex(bits);
      write(HOME_STORE, saved);
      SHARED_STORES.forEach(k => write(k, saved));
    }
    $('gate').hidden = true;
    document.body.classList.remove('locked');
    const s = document.createElement('script');
    s.textContent = source;
    document.body.appendChild(s);
  }
  // Stay signed in on this device: the derived key (not the password) is remembered
  async function tryRemembered(){
    const saved = read(HOME_STORE) || read('french-unlock') || read('challenge-unlock');
    if(!saved) return false;
    const c = cipher();
    const [saltHex, bitsHex] = saved.split(':');
    if(saltHex !== hex(c.salt) || !bitsHex) return false;
    const bits = unhex(bitsHex);
    const text = await unlock(bits, c);
    if(!text){ write(HOME_STORE, null); return false; }
    launch(text, c, bits);
    return true;
  }
  function showError(msg){
    $('gateError').textContent = msg;
    $('gateError').hidden = false;
  }

  $('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('gateBtn');
    $('gateError').hidden = true;
    if(!window.crypto || !crypto.subtle){ showError('This browser can’t sign in here. Try Safari or Chrome.'); return; }
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try{
      const c = cipher();
      const bits = await deriveBits($('gateUser').value.trim() + '|' + $('gatePass').value, c.salt);
      const text = await unlock(bits, c);
      if(!text){
        showError('That username or password isn’t right.');
        $('gatePass').value = '';
        $('gatePass').focus();
      }else{
        launch(text, c, bits);
      }
    }catch(err){
      showError('Something went wrong. Please try again.');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });

  // ---------- QR code guest sign-in ----------
  // The QR code opens this page with ?guest. That asks the Apps Script (src/guest-login.gs) to email a
  // 6-digit code to the owner; the right code gets back the guest key, which decrypts #guestData (a copy
  // of the home page) and nothing else. It is kept with its expiry and dropped after 2 hours.
  const GUEST_API = '';                    // the Apps Script web app URL (…/exec)
  const GUEST_STORE = 'scholarship-guest';
  const fromQR = new URLSearchParams(location.search).has('guest');

  async function guestUnlock(keyHex){
    try{
      const bytes = Uint8Array.from(atob($('guestData').textContent.trim()), ch => ch.charCodeAt(0));
      const key = await crypto.subtle.importKey('raw', unhex(keyHex), {name: 'AES-CBC'}, false, ['decrypt']);
      const text = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-CBC', iv: bytes.slice(0, 16)}, key, bytes.slice(16)));
      return text.startsWith(MARKER) ? text : null;
    }catch(e){
      return null;
    }
  }
  function guestLaunch(text, expires){
    launch(text);
    const pill = document.createElement('p');
    pill.className = 'guest-pill';
    pill.textContent = 'Guest access until ' + new Date(expires).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    document.body.appendChild(pill);
    // checked every 20s rather than one long timer, which phones pause while the tab is in the background
    const check = () => { if(Date.now() >= expires){ write(GUEST_STORE, null); location.replace(location.pathname); } };
    setInterval(check, 20000);
    document.addEventListener('visibilitychange', check);
  }
  async function tryGuest(){
    let saved = null;
    try{ saved = JSON.parse(read(GUEST_STORE)); }catch(e){}
    if(!saved || !saved.key || !(saved.expires > Date.now())){ write(GUEST_STORE, null); return false; }
    const text = await guestUnlock(saved.key);
    if(!text){ write(GUEST_STORE, null); return false; }
    guestLaunch(text, saved.expires);
    return true;
  }
  async function callGuest(params){
    const res = await fetch(GUEST_API + '?' + new URLSearchParams(params));
    return res.json();
  }
  function guestError(msg){
    $('guestError').textContent = msg;
    $('guestError').hidden = !msg;
  }
  async function sendCode(){
    $('gateSub').textContent = 'Sending a sign-in code…';
    guestError('');
    if(!GUEST_API){ $('gateSub').textContent = 'QR sign-in isn’t set up yet.'; return; }
    try{
      const r = await callGuest({action: 'send'});
      if(r.ok) $('gateSub').textContent = 'A 6-digit code has been emailed to Shlok. Ask for it and type it here. It works for ' + r.minutes + ' minutes.';
      else{ $('gateSub').textContent = 'The code couldn’t be sent.'; guestError(r.error); }
    }catch(e){
      $('gateSub').textContent = 'The code couldn’t be sent.';
      guestError('Check the internet connection and try again.');
    }
  }
  function showGuest(on){
    $('guestForm').hidden = !on;
    $('gateForm').hidden = on;
    $('gateFoot').hidden = on;
    if(!on) $('gateSub').textContent = 'Sign in once to open your courses and every study tool.';
  }

  $('guestForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('guestBtn');
    const code = $('guestCode').value.replace(/\D/g, '');
    guestError('');
    if(code.length !== 6){ guestError('The code has 6 digits.'); return; }
    btn.disabled = true;
    btn.textContent = 'Checking…';
    try{
      const r = await callGuest({action: 'verify', code});
      if(!r.ok){
        guestError(r.error || 'That code isn’t right.');
        $('guestCode').value = '';
        $('guestCode').focus();
        return;
      }
      const text = await guestUnlock(r.key);
      if(!text){ guestError('The page has been updated. Ask Shlok for a new QR code.'); return; }
      write(GUEST_STORE, JSON.stringify({key: r.key, expires: r.expires}));
      history.replaceState(null, '', location.pathname);
      guestLaunch(text, r.expires);
    }catch(err){
      guestError('Something went wrong. Please try again.');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Sign in for 2 hours';
    }
  });
  $('guestResend').addEventListener('click', () => { sessionStorage.setItem('guest-sent', Date.now()); sendCode(); });
  $('guestToLogin').addEventListener('click', () => { showGuest(false); $('gateUser').focus(); });

  // the home page calls this from its Sign out button: signs out of everything on this device
  window.signOutEverywhere = () => {
    [HOME_STORE, ...SHARED_STORES, GUEST_STORE].forEach(k => write(k, null));
    location.replace(location.pathname);
  };

  (async () => (await tryRemembered()) || (await tryGuest()))().then(ok => {
    if(ok) return;
    $('gateCard').classList.remove('pending');
    if(fromQR){
      showGuest(true);
      // scanning sends the email; reloading the page within 10 minutes doesn't send another
      const last = Number(sessionStorage.getItem('guest-sent') || 0);
      if(Date.now() - last > 10 * 60 * 1000){
        sessionStorage.setItem('guest-sent', Date.now());
        sendCode();
      }else{
        $('gateSub').textContent = 'A 6-digit code has been emailed to Shlok. Ask for it and type it here.';
      }
      $('guestCode').focus({preventScroll: true});
    }else{
      $('gateUser').focus({preventScroll: true});
    }
  });
})();
</script>
