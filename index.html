<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study for Scholarships</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#211E1A;
    --ink-soft:#5B5348;
    --paper:#FBF9F3;
    --glass:rgba(16,22,32,0.62);
    --glass-strong:rgba(16,22,32,0.78);
    --glass-line:rgba(255,255,255,0.16);
    --text:#F5F1E8;
    --text-soft:#C9C2B4;
    --gold:#D9B45F;
    --rouge:#AE2530;
    --navy:#1C2B3A;
    --serif:'Fraunces', Georgia, 'Times New Roman', serif;
    --sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:var(--sans);
    color:var(--text);
    background:#1b1510 url("bg.jpg") center / cover fixed no-repeat;
    line-height:1.5;
  }
  /* darken the photo so every card reads clearly on top of it */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      linear-gradient(180deg, rgba(12,10,8,0.55) 0%, rgba(12,10,8,0.72) 55%, rgba(12,10,8,0.88) 100%);
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  /* ---------- Sign-in ---------- */
  body.locked #app{display:none;}
  .gate{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:16px;}
  .gate[hidden]{display:none;}
  .gate-card{
    width:min(390px, 100%);
    background:rgba(251,249,243,0.95);color:var(--ink);
    border-radius:12px;padding:30px 28px 24px;
    box-shadow:0 24px 60px rgba(0,0,0,0.45);
    transition:opacity .25s ease;
  }
  .gate-card.pending{opacity:0;pointer-events:none;}
  .gate-mark{width:44px;height:44px;border-radius:10px;background:var(--navy);display:grid;place-items:center;margin-bottom:16px;}
  .gate-title{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.15;margin:0 0 4px;color:var(--navy);}
  .gate-sub{margin:0 0 20px;font-size:14px;color:var(--ink-soft);}
  .gate-form{display:grid;gap:12px;}
  .gate-form label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--ink-soft);}
  .gate-form input{width:100%;padding:10px 12px;font:inherit;font-size:16px;border:1px solid rgba(33,30,26,0.18);border-radius:6px;background:#fff;color:var(--ink);}
  .gate-form input:focus-visible{outline:2px solid var(--rouge);outline-offset:1px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:6px;padding:12px 18px;font-size:15px;font-weight:500;background:var(--navy);color:#fff;text-decoration:none;}
  .btn:hover{background:#2E4258;}
  .btn[disabled]{opacity:.7;cursor:wait;}
  .gate-error{margin:0;font-size:13.5px;color:#821A22;}
  .gate-error[hidden]{display:none;}

  /* ---------- Home ---------- */
  #app{position:relative;z-index:1;}
  .wrap{max-width:1080px;margin:0 auto;padding:40px 24px 80px;}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:36px;}
  .eyebrow{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px, 5vw, 52px);line-height:1.05;margin:0 0 10px;}
  .lede{margin:0;max-width:56ch;color:var(--text-soft);font-size:16.5px;}
  .account{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text-soft);padding-top:6px;}
  .link-btn{background:none;border:none;padding:0;color:var(--text);text-decoration:underline;font-size:13px;}
  .section{margin-top:44px;}
  .section-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .section-head h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0;}
  .section-head p{margin:0;color:var(--text-soft);font-size:14px;}

  .webs{display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:18px;}
  .web{
    position:relative;display:flex;flex-direction:column;gap:10px;
    background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;
    padding:24px 24px 22px;text-decoration:none;color:var(--text);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
    overflow:hidden;
  }
  .web::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--stripe);}
  .web:hover{transform:translateY(-2px);border-color:rgba(255,255,255,0.32);background:var(--glass-strong);}
  .web .tag{font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
  .web h3{font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.2;margin:0;}
  .web p{margin:0;color:var(--text-soft);font-size:14.5px;flex:1;}
  .web .go{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:14.5px;margin-top:6px;}

  .folders{display:grid;gap:14px;}
  .folder{background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
  .folder > summary{
    list-style:none;display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none;
  }
  .folder > summary::-webkit-details-marker{display:none;}
  .folder-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--tint);}
  .folder-name{font-family:var(--serif);font-weight:600;font-size:21px;}
  .folder-count{color:var(--text-soft);font-size:13px;margin-left:auto;}
  .chev{transition:transform .2s ease;flex:none;opacity:.75;}
  .folder[open] .chev{transform:rotate(90deg);}
  .folder-body{padding:0 20px 18px;}
  .group-label{margin:12px 0 8px;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-soft);}
  .items{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));gap:10px;}
  .item{
    display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:10px;
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
    text-decoration:none;color:var(--text);transition:background .15s ease, border-color .15s ease;
  }
  .item:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.25);}
  .item-title{font-weight:600;font-size:15px;line-height:1.3;}
  .item-desc{font-size:13px;color:var(--text-soft);flex:1;}
  .badge{align-self:flex-start;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
  .badge.artifact{background:rgba(217,180,95,0.18);color:#F1D58E;}
  .badge.site{background:rgba(120,190,140,0.18);color:#A9DDB6;}
  .note{margin:14px 0 0;font-size:12.5px;color:var(--text-soft);}

  .credit{position:relative;z-index:1;text-align:center;font-size:11.5px;color:rgba(245,241,232,0.6);padding:0 16px 20px;}
  .credit a{color:rgba(245,241,232,0.8);}

  @media (max-width: 600px){
    .wrap{padding:28px 16px 60px;}
    .gate-card{padding:24px 20px 20px;}
    .webs{grid-template-columns:1fr;}
    .folder > summary{padding:14px 16px;}
    .folder-body{padding:0 16px 16px;}
    body{background-attachment:scroll;}
  }
  @media (prefers-reduced-motion: reduce){
    .web, .item, .chev{transition:none;}
  }
</style>
</head>
<body class="locked">

<section class="gate" id="gate" aria-label="Sign in">
  <div class="gate-card pending" id="gateCard">
    <div class="gate-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="none" stroke="#D9B45F" stroke-width="1.8" stroke-linejoin="round" d="M12 4 2 9l10 5 10-5-10-5zM6 11v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5M22 9v6"/></svg>
    </div>
    <h1 class="gate-title">Study for Scholarships</h1>
    <p class="gate-sub">Sign in once to open everything — the French course, Challenge Reading and your study tools.</p>
    <form class="gate-form" id="gateForm">
      <label>Username
        <input id="gateUser" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label>Password
        <input id="gatePass" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn" id="gateBtn">Sign in</button>
      <p class="gate-error" id="gateError" role="alert" hidden></p>
    </form>
  </div>
</section>

<main id="app"></main>

<script>
// The home page (src/home.js, kept off GitHub) is published only in encrypted form (#homeData).
// Signing in derives a key from "username|password" with PBKDF2 and decrypts it. The salt is shared
// with the French course and Challenge Reading (both on this same site), so the same key is saved for
// them too: one sign-in here opens all three.
(function(){
  const $ = (id) => document.getElementById(id);
  const ITERATIONS = 250000;              // must match src/build.sh
  const MARKER = '// scholarship-home-v1';
  const HOME_STORE = 'scholarship-unlock';
  const SHARED_STORES = ['french-unlock', 'challenge-unlock'];   // the French course and Challenge Reading

  const hex = (u) => Array.from(u, x => x.toString(16).padStart(2, '0')).join('');
  const unhex = (s) => new Uint8Array(s.match(/../g).map(h => parseInt(h, 16)));
  const read = (k) => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
  const write = (k, v) => { try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} };

  function cipher(){
    const bytes = Uint8Array.from(atob($('homeData').textContent.trim()), ch => ch.charCodeAt(0));
    return {salt: bytes.slice(8, 16), body: bytes.slice(16)};
  }
  async function deriveBits(pass, salt){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt, iterations: ITERATIONS, hash: 'SHA-256'}, base, 384));
  }
  async function unlock(bits, c){
    try{
      const key = await crypto.subtle.importKey('raw', bits.slice(0, 32), {name: 'AES-CBC'}, false, ['decrypt']);
      const text = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-CBC', iv: bits.slice(32, 48)}, key, c.body));
      return text.startsWith(MARKER) ? text : null;
    }catch(e){
      return null;
    }
  }
  function launch(source, c, bits){
    const saved = hex(c.salt) + ':' + hex(bits);
    write(HOME_STORE, saved);
    SHARED_STORES.forEach(k => write(k, saved));
    $('gate').hidden = true;
    document.body.classList.remove('locked');
    const s = document.createElement('script');
    s.textContent = source;
    document.body.appendChild(s);
  }
  // Stay signed in on this device: the derived key (not the password) is remembered
  async function tryRemembered(){
    const saved = read(HOME_STORE) || read('french-unlock') || read('challenge-unlock');
    if(!saved) return false;
    const c = cipher();
    const [saltHex, bitsHex] = saved.split(':');
    if(saltHex !== hex(c.salt) || !bitsHex) return false;
    const bits = unhex(bitsHex);
    const text = await unlock(bits, c);
    if(!text){ write(HOME_STORE, null); return false; }
    launch(text, c, bits);
    return true;
  }
  function showError(msg){
    $('gateError').textContent = msg;
    $('gateError').hidden = false;
  }

  $('gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('gateBtn');
    $('gateError').hidden = true;
    if(!window.crypto || !crypto.subtle){ showError('This browser can’t sign in here. Try Safari or Chrome.'); return; }
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try{
      const c = cipher();
      const bits = await deriveBits($('gateUser').value.trim() + '|' + $('gatePass').value, c.salt);
      const text = await unlock(bits, c);
      if(!text){
        showError('That username or password isn’t right.');
        $('gatePass').value = '';
        $('gatePass').focus();
      }else{
        launch(text, c, bits);
      }
    }catch(err){
      showError('Something went wrong. Please try again.');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });

  // the home page calls this from its Sign out button: signs out of everything on this device
  window.signOutEverywhere = () => {
    [HOME_STORE, ...SHARED_STORES].forEach(k => write(k, null));
    location.reload();
  };

  tryRemembered().then(ok => {
    if(!ok){
      $('gateCard').classList.remove('pending');
      $('gateUser').focus({preventScroll: true});
    }
  });
})();
</script>
